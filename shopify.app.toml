# Shopify app configuration — expense-calculator
# See: projects/expense-calculator/spec.md, decisions/architecture-packet.md,
# ADR-0006 (zero Admin API dependency / scopes: []), ADR-0002 (compliance
# webhooks via compliance_topics, no runtime subscription mutation).
#
# PROVENANCE (reconciled 2026-09-18, G4-sprint-1.1 bug-fix follow-up): this
# file was regenerated by a real `shopify app config link` / `shopify app
# dev` run against the actual Partner Dashboard app record — client_id
# 54ba785866ef1841cfa1f6e015f46bb4 matches the key in the git-ignored
# .shopify/project.json, which records dev_store_url = wds55.myshopify.com.
# A plain-text client_id in this file is normal, documented Shopify practice
# (it is not a secret) — do not env-var it out.
#
# SCHEMA RECONCILIATION: verified against shopify.dev ("Manage webhook
# subscriptions", "Subscribe to compliance webhooks") and against the actual
# installed Shopify CLI validator (`shopify app config validate --json` →
# {"valid": true, "issues": []}) for api_version 2026-07. Every official
# example shows `compliance_topics` as a field INSIDE an individual
# `[[webhooks.subscriptions]]` block, never as a bare [webhooks]-level array.
# The CLI relink had (harmlessly, since the validator doesn't flag unknown
# extra keys) carried forward a redundant top-level `[webhooks]
# compliance_topics = [...]` array that also existed in the original
# hand-authored version of this file — removed here as dead/duplicate
# config; the four per-subscription entries below (one per topic/route) are
# the single source of truth.

name = "Expense Calculator"
client_id = "54ba785866ef1841cfa1f6e015f46bb4"
# VERIFY AT BUILD (local-dev-only value): points at the local dev server so
# direct-to-server test probes run FROM THIS SAME MACHINE (see
# dev-evidence/g4-sprint-1.1-live-evidence*/) can hit the app. Shopify's own
# servers CANNOT reach a bare http://localhost — a real install or a real
# Shopify-initiated webhook delivery on any store (even a disposable dev
# store) requires a public HTTPS tunnel (`shopify app dev` or equivalent)
# with application_url pointed at that tunnel URL, not at localhost.
application_url = "http://localhost:3000"
embedded = true

[access_scopes]
# CONFIRMED at G0.5 / locked by ADR-0006: zero access scopes. Revenue is
# merchant-entered; the app makes no Admin GraphQL call on any core path.
# Do NOT add a scope here without an RFC (see ADR-0006 "Alternative
# considered" / fallback position).
scopes = ""
use_legacy_install_flow = false
optional_scopes = [ ]

[auth]
# Empty on purpose: this app uses token exchange + managed installation only
# (ADR-0007) — app/routes/auth.$.tsx calls authenticate.admin() directly and
# there is no separate OAuth authorization-code callback route, so no
# redirect_urls entry is exercised by this app. Left empty rather than
# populated with an unused localhost placeholder.
redirect_urls = [ ]

[webhooks]
api_version = "2026-07"

  # app/uninstalled is not a compliance_topics entry — it is a normal
  # declarative webhook subscription. Declared here, NOT registered via a
  # runtime Admin API mutation (ADR-0006 — zero Admin API dependency on any
  # core path).
  [[webhooks.subscriptions]]
  uri = "/webhooks/app-uninstalled"
  topics = [ "app/uninstalled" ]

  # Mandatory GDPR/privacy compliance webhooks (App Store Requirement). One
  # subscription per topic, each routed to its own handler — matches
  # app/routes/webhooks.customers-data-request.tsx,
  # webhooks.customers-redact.tsx, and webhooks.shop-redact.tsx respectively.
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers-data-request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers-redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop-redact"
  compliance_topics = [ "shop/redact" ]

# No [app_proxy] section — not used. extensions: [] confirmed at G0.5/G1.5.
# Do not add an app proxy without an RFC.

[pos]
embedded = false

[build]
include_config_on_deploy = true
