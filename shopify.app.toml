# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "54ba785866ef1841cfa1f6e015f46bb4"
name = "Expense Calculator"

# application_url — live Vercel deployment (a real, presumably-persistent
# hosting URL, not a per-session dev tunnel like the previous
# trycloudflare.com value it replaces).
#
# *** COMPLIANCE WARNING — DO NOT ASSUME WEBHOOKS WORK CORRECTLY HERE ***
# The code currently deployed at this URL still runs the OLD in-process-timer
# webhook-processing mechanism (app/workers/drain-worker.ts +
# app/workers/sweeper.ts, ADR-0001/ADR-0002-era — the same mechanism
# BUG-1/BUG-2/BUG-4/BUG-5 were fixed and live-verified against, under the
# long-running-always-on-Node hosting assumption). It has NOT been replaced by
# the serverless-compatible redesign proposed in ADR-0009 (fast-tier
# waitUntil-based post-response drain + a Vercel Cron Function slow tier as
# the real guarantee) and its required companion ADR-0010 (pooled-Postgres
# connection strategy for serverless). That redesign is DESIGNED BUT NOT
# IMPLEMENTED — it is pending an explicit human decision at gate
# G1.5-revision (see project.json, current_gate). Vercel's per-invocation
# execution model does not keep in-process setInterval timers alive between
# requests, so the mandatory GDPR compliance webhooks (customers/data_request,
# customers/redact, shop/redact) routed to this URL will NOT reliably process
# until the ADR-0009/0010 redesign actually lands. Do not let this
# application_url value be read as evidence that compliance processing works
# in production — it currently does not.
application_url = "https://shopify-public-app-expense-calculat.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers-data-request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers-redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop-redact"
  compliance_topics = [ "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app-uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = ""
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
# Empty on purpose (ADR-0007, already established — not relitigated here):
# this app uses token exchange + managed installation only.
# app/routes/auth.$.tsx calls authenticate.admin() directly and there is no
# separate OAuth authorization-code callback route, so no redirect_urls entry
# is ever exercised. This is unaffected by the hosting-class change — only
# the compliance-webhook processing model is (see the application_url
# comment above); the auth mechanism itself stays token-exchange regardless
# of where the app is deployed.
redirect_urls = [ ]

[pos]
embedded = false
