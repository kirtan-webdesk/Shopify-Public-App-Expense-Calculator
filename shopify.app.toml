# Shopify app configuration — expense-calculator
# See: projects/expense-calculator/spec.md, decisions/architecture-packet.md,
# ADR-0006 (zero Admin API dependency / scopes: []), ADR-0002 (compliance
# webhooks via compliance_topics, no runtime subscription mutation).
#
# VERIFY AT BUILD: exact TOML shape (especially [webhooks] / compliance_topics
# keys) against the Shopify CLI version resolved at build time and against
# api_version 2026-07 — this file is hand-authored, not CLI-generated, because
# no `shopify app init` was run in this environment (no Partner/CLI
# credentials here — OQ-2/OQ-3). Run `shopify app config link` (or
# equivalent) against the real Partner app record before first deploy to
# confirm this file matches what the CLI expects, then commit any diff as a
# reviewed change, not a silent drift.

name = "expense-calculator"
client_id = "" # VERIFY AT BUILD / OQ-3: filled from the Partner Dashboard app record via the credentials-handoff channel. Never hard-code a real client_id in a commit.
application_url = "SHOPIFY_APP_URL" # placeholder token; replaced by the real app URL via env/CLI at deploy time — never a literal secret
embedded = true

[access_scopes]
# CONFIRMED at G0.5 / locked by ADR-0006: zero access scopes. Revenue is
# merchant-entered; the app makes no Admin GraphQL call on any core path.
# Do NOT add a scope here without an RFC (see ADR-0006 "Alternative
# considered" / fallback position).
scopes = ""
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "SHOPIFY_APP_URL/auth/callback",
]

[webhooks]
api_version = "2026-07"

# Mandatory GDPR/privacy compliance webhooks (App Store Requirement).
# Declared here, NOT registered via a runtime Admin API mutation
# (ADR-0006 — zero Admin API dependency on any core path).
compliance_topics = [
  "customers/data_request",
  "customers/redact",
  "shop/redact",
]

# app/uninstalled is not a compliance_topics entry — it is a normal
# declarative webhook subscription.
[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app-uninstalled"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request"]
uri = "/webhooks/customers-data-request"

[[webhooks.subscriptions]]
compliance_topics = ["customers/redact"]
uri = "/webhooks/customers-redact"

[[webhooks.subscriptions]]
compliance_topics = ["shop/redact"]
uri = "/webhooks/shop-redact"

# No [app_proxy] section — not used. extensions: [] confirmed at G0.5/G1.5.
# Do not add an app proxy without an RFC.

[pos]
embedded = false

[build]
include_config_on_deploy = true
