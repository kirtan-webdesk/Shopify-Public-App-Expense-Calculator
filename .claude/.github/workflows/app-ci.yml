name: App CI (template for the generated Shopify app)
# Copied into the scaffolded app repo. Mandatory checks run WITHOUT --if-present:
# the app MUST define lint / typecheck / test / build scripts, or CI fails loudly.
on:
  push:
    paths: ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.graphql", "**/*.css", "**/*.json", "**/*.toml", ".github/workflows/**"]
  pull_request:
    paths: ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.graphql", "**/*.css", "**/*.json", "**/*.toml", ".github/workflows/**"]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - name: Lint (mandatory)
        run: npm run lint
      - name: Typecheck (mandatory)
        run: npm run typecheck
      - name: Test (mandatory)
        run: npm test
      - name: Build (mandatory)
        run: npm run build
